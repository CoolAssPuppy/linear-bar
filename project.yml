name: LinearBar
options:
  bundleIdPrefix: com.strategicnerds
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "1.17.0"
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    exactVersion: "4.2.2"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: "3.56.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 955GSY56UT
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  LinearBar:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - LinearBarTests
      gatherCoverageData: true
    sources:
      - path: Source
    dependencies:
      - package: Sparkle
      - package: KeyboardShortcuts
      - package: KeychainAccess
      - package: PostHog
    settings:
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
          CODE_SIGN_ENTITLEMENTS: Source/Resources/LinearBarDebug.entitlements
          ENABLE_HARDENED_RUNTIME: NO
          MERGED_BINARY_TYPE: manual
          MERGEABLE_LIBRARY: NO
          INFOPLIST_KEY_LSMultipleInstancesProhibited: NO
      base:
        # PostHog telemetry. The api_key is intentionally read from an env var so
        # forks and dev builds don't write into the prod project. Set it in your
        # shell (Doppler) before running `xcodegen generate` / building.
        # Telemetry.setup() silently disables capture when the key is missing.
        # It used to be hardcoded here and pointed at the Strategic Nerds Blog
        # project, which is why months of menu-bar events landed in the blog's
        # analytics instead of this app's.
        POSTHOG_API_KEY: "$(POSTHOG_API_KEY)"
        POSTHOG_HOST: "https://us.i.posthog.com"
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.LinearBarApp
        PRODUCT_NAME: "Linear Bar"
        PRODUCT_MODULE_NAME: LinearBar
        MARKETING_VERSION: "2.1.10"
        CURRENT_PROJECT_VERSION: "28"
        INFOPLIST_FILE: Source/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Source/Resources/LinearBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LS_MINIMUM_SYSTEM_VERSION: "14.0"
        INFOPLIST_KEY_LSMultipleInstancesProhibited: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES

  LinearBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LinearBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strategicnerds.LinearBarTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Linear Bar.app/Contents/MacOS/Linear Bar"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
